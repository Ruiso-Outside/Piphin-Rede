<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: piphin:; style-src 'self' 'unsafe-inline' piphin:; script-src 'self'; font-src 'self' data: piphin:">
  <title>Piphin Rede</title>
  <link rel="stylesheet" href="piphin://ui/kit.css">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="in-hub">
  <nav class="p-subnav">
    <button class="nav active" data-tab="home"><i class="i i-gauge"></i>Visão geral</button>
    <button class="nav" data-tab="wifi"><i class="i i-wifi"></i>Wi-Fi</button>
    <button class="nav" data-tab="usage"><i class="i i-activity"></i>Uso</button>
    <button class="nav" data-tab="devices"><i class="i i-router"></i>Aparelhos</button>
    <button class="nav" data-tab="tests"><i class="i i-timer"></i>Testes</button>
    <div class="grow"></div>
    <span class="live-pill" id="livePill"><i class="i i-arrow-down"></i><b id="pillDown">--</b><i class="i i-arrow-up"></i><b id="pillUp">--</b></span>
  </nav>
  <main id="content"></main>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" class="toasts"></div>
  <script src="js/app.js"></script>

</html>
